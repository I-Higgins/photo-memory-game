<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Memory game – iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F4EFE7}
a{color:#2D5F5D}a:hover{color:#1F4644}
.btn{font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;box-sizing:border-box}
.btn-quiet{background:#FFFDF9;color:#2A2521;border:2px solid #D6CBBB}
.face{position:absolute;inset:0;border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(42,37,33,.12)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #F4EFE7; color: #2A2521; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, Arial, sans-serif; overflow: hidden">
<header style="position: absolute; left: 16px; right: 16px; top: 59px; height: 52px; display: flex; align-items: center; justify-content: space-between">
<a href="PhoneHome.dc.html" class="btn btn-quiet" style="height: 48px; padding: 0 14px 0 8px; border-radius: 14px; font-size: 18px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Back</a>
<h1 style="margin: 0; font-size: 20px; font-weight: 700">Family favourites</h1>
<span style="width: 88px"></span>
</header>
<main style="position: absolute; left: 16px; right: 16px; top: 131px; height: 599px; display: flex; align-items: center; justify-content: center">
<div style="display: grid; grid-template-columns: repeat(3, 112px); gap: 10px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="12">
<button type="button" aria-label="{{c.label}}" style="position: relative; width: 112px; height: 140px; border: 0; padding: 0; background: none; border-radius: 12px">
<sc-if value="{{c.down}}" hint-placeholder-val="{{ true }}">
<span class="face" style="background: #2D5F5D; display: block"><span style="position: absolute; inset: 6px; border: 2px solid rgba(244,239,231,.45); border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="48" height="41" viewBox="0 0 104 88" fill="none" stroke="#F4EFE7" stroke-width="4" stroke-linejoin="round"><rect x="8" y="14" width="54" height="62" rx="6" transform="rotate(-9 35 45)" opacity=".55"></rect><rect x="40" y="10" width="54" height="62" rx="6" transform="rotate(8 67 41)"></rect><path d="M67 52c-7-5-11-9-11-13.5a5.5 5.5 0 0 1 11-1.5 5.5 5.5 0 0 1 11 1.5C78 43 74 47 67 52z" fill="#F4EFE7"></path></svg></span></span>
</sc-if>
<sc-if value="{{c.up}}" hint-placeholder-val="{{ false }}">
<span class="face" style="background: #FFFDF9; padding: 5px; box-sizing: border-box; display: block; box-shadow: {{c.ring}}"><img src="{{c.src}}" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 8px">
<sc-if value="{{c.matched}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 14px; background: #2D5F5D; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #FFFDF9"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
</span>
</sc-if>
</button>
</sc-for>
</div>
</main>
<nav aria-label="Game controls" style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 64px; display: flex; gap: 12px">
<button type="button" class="btn btn-quiet" style="flex: 1; height: 60px; border-radius: 16px; font-size: 19px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2.2h5c.1-1 .5-1.7 1.1-2.2A6 6 0 0 0 12 3z"></path></svg>Hint</button>
<button type="button" class="btn btn-quiet" style="flex: 1; height: 60px; border-radius: 16px; font-size: 19px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>Restart</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var P = { beach: '../assets/demo-photos/beach.svg', boat: '../assets/demo-photos/boat.svg', fish: '../assets/demo-photos/fish.svg', dog: '../assets/demo-photos/dog.svg', ute: '../assets/demo-photos/ute.svg', roses: '../assets/demo-photos/roses.svg' };
var L = [['boat','p'],['dog','m'],['roses','d'],['ute','d'],['beach','m'],['fish','d'],['dog','m'],['boat','d'],['roses','d'],['beach','m'],['ute','d'],['fish','d']];
class Component extends DCLogic {
  renderVals() {
    return { cards: L.map(function (x, i) {
      var st = x[1];
      return { down: st === 'd', up: st !== 'd', matched: st === 'm', src: P[x[0]], label: st === 'd' ? 'Card ' + (i + 1) + ', face down' : x[0],
        ring: st === 'p' ? '0 0 0 4px #A86B14' : (st === 'm' ? 'inset 0 0 0 3px #2D5F5D, 0 4px 10px rgba(42,37,33,.12)' : '0 4px 10px rgba(42,37,33,.12)') };
    }) };
  }
}
</script>
</body>
</html>
